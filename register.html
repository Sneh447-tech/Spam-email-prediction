<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<style>
body {
    font-family: Arial;
    background: linear-gradient(to right, #667eea, #764ba2);
    text-align: center;
    color: white;
}
.box {
    margin-top: 100px;
    background: white;
    color: black;
    padding: 30px;
    border-radius: 10px;
    display: inline-block;
}
input, button {
    padding: 10px;
    margin: 10px;
    width: 80%;
}
button {
    background: #667eea;
    color: white;
    border: none;
    cursor: pointer;
}
button:hover {
    background: #5a67d8;
}
</style>
</head>
<body>

<div class="box">
<h2>📝 Create Account</h2>
<form method="post">
<input name="username" placeholder="Username"><br>
<input name="password" type="password" placeholder="Password"><br>
<button>Register</button>
</form>

<a href="/login">Already have account? Login</a>
</div>

</body>
</html>
