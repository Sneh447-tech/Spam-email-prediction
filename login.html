<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body {
    font-family: Arial;
    background: linear-gradient(to right, #ff7e5f, #feb47b);
    text-align: center;
    color: white;
}
.box {
    margin-top: 100px;
    background: white;
    color: black;
    padding: 30px;
    border-radius: 10px;
    display: inline-block;
}
input, button {
    padding: 10px;
    margin: 10px;
    width: 80%;
}
button {
    background: #ff7e5f;
    color: white;
    border: none;
}
button:hover {
    background: #e76f51;
}
</style>
</head>
<body>

<div class="box">
<h2>🔐 Login</h2>
<form method="post">
<input name="username"><br>
<input name="password" type="password"><br>
<button>Login</button>
</form>
</div>

</body>
</html>
